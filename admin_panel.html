<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Green Coal Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Admin Data Entry</h1>
        <p class="text-center text-gray-500 mb-6">Input the latest data for a ward or block.</p>
        
        <form id="data-form">
            <div class="mb-4">
                <label for="ward-name" class="block text-gray-700 font-medium mb-2">Ward/Block Name</label>
                <input type="text" id="ward-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                     <label for="waste-converted" class="block text-gray-700 font-medium mb-2">Waste Converted (kg)</label>
                    <input type="number" step="0.01" id="waste-converted" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                 <div>
                    <label for="biocharcoal" class="block text-gray-700 font-medium mb-2">Biocharcoal (kg)</label>
                    <input type="number" step="0.01" id="biocharcoal" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                     <label for="energy-generated" class="block text-gray-700 font-medium mb-2">Energy Generated (kWh)</label>
                    <input type="number" step="0.01" id="energy-generated" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                 <div>
                    <label for="carbon-saved" class="block text-gray-700 font-medium mb-2">CO₂ Saved (kg)</label>
                    <input type="number" step="0.01" id="carbon-saved" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
             <div class="mb-4">
                <label for="oxygen-level" class="block text-gray-700 font-medium mb-2">Outside Air O₂ Level (%)</label>
                <input type="number" step="0.01" id="oxygen-level" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>

            <div class="mb-6">
                <label for="data-datetime" class="block text-gray-700 font-medium mb-2">Date and Time</label>
                <input type="datetime-local" id="data-datetime" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition duration-300">Submit Data</button>
        </form>
        <div id="message" class="mt-4 text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAx8LtH4Zpol84M8U0aNCod-KIbACOsKYo",
          authDomain: "green-coal-network.firebaseapp.com",
          projectId: "green-coal-network",
          storageBucket: "green-coal-network.firebasestorage.app",
          messagingSenderId: "415942730043",
          appId: "1:415942730043:web:da2825af912795bb79171e",
          measurementId: "G-FT45QQC719"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('data-form');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const wardName = document.getElementById('ward-name').value;
            const wasteConverted = parseFloat(document.getElementById('waste-converted').value);
            const biocharcoal = parseFloat(document.getElementById('biocharcoal').value);
            const energyGenerated = parseFloat(document.getElementById('energy-generated').value);
            const carbonSaved = parseFloat(document.getElementById('carbon-saved').value);
            const oxygenLevel = parseFloat(document.getElementById('oxygen-level').value);
            const dateTimeString = document.getElementById('data-datetime').value;
            
            if (!dateTimeString) {
                messageDiv.textContent = 'Please select a date and time.';
                messageDiv.className = 'mt-4 text-center text-red-600';
                 setTimeout(() => { messageDiv.textContent = ''; }, 3000);
                return;
            }

            try {
                const firestoreTimestamp = Timestamp.fromDate(new Date(dateTimeString));

                await addDoc(collection(db, "wardsData"), {
                    wardName: wardName,
                    wasteConverted: wasteConverted,
                    biocharcoal: biocharcoal,
                    energyGenerated: energyGenerated,
                    carbonSaved: carbonSaved,
                    oxygenLevel: oxygenLevel,
                    timestamp: firestoreTimestamp
                });

                messageDiv.textContent = 'Data submitted successfully!';
                messageDiv.className = 'mt-4 text-center text-green-600';
                
                // Manually reset form fields for better reliability
                document.getElementById('ward-name').value = '';
                document.getElementById('waste-converted').value = '';
                document.getElementById('biocharcoal').value = '';
                document.getElementById('energy-generated').value = '';
                document.getElementById('carbon-saved').value = '';
                document.getElementById('oxygen-level').value = '';
                document.getElementById('data-datetime').value = '';

            } catch (error) {
                console.error("Error adding document: ", error);
                messageDiv.textContent = 'Error submitting data. Please try again.';
                messageDiv.className = 'mt-4 text-center text-red-600';
            }

            setTimeout(() => {
                messageDiv.textContent = '';
            }, 3000);
        });
    </script>
</body>
</html>
